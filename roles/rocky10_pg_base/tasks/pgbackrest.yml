---
- name: Install pgbackrest (comes from the PGDG repo already added)
  ansible.builtin.dnf:
    name: pgbackrest
    state: present

- name: Ensure the pgBackRest repo directory exists (posix repo type)
  ansible.builtin.file:
    path: "{{ pgbackrest_repo_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: pgbackrest_repo_type == "posix"

- name: Ensure /etc/pgbackrest exists
  ansible.builtin.file:
    path: /etc/pgbackrest
    state: directory
    owner: root
    group: postgres
    mode: "0750"

- name: Deploy pgbackrest.conf
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"
  register: pgbackrest_conf

- name: Restart PostgreSQL if pgbackrest.conf changed (archive_command depends on it)
  ansible.builtin.systemd:
    name: "{{ pg_service_name }}"
    state: restarted
  when: pgbackrest_conf.changed

- name: Check whether the stanza already exists
  ansible.builtin.command: >
    pgbackrest --stanza={{ pgbackrest_stanza }} --log-level-console=off info
  register: stanza_check
  become: true
  become_user: postgres
  changed_when: false
  failed_when: false

- name: Create the pgBackRest stanza
  ansible.builtin.command: >
    pgbackrest --stanza={{ pgbackrest_stanza }} stanza-create
  become: true
  become_user: postgres
  when: "'status: 0' not in stanza_check.stdout"

- name: Run a quick pgbackrest check (validates WAL archiving end-to-end)
  ansible.builtin.command: >
    pgbackrest --stanza={{ pgbackrest_stanza }} check
  become: true
  become_user: postgres
  register: pgbackrest_check
  changed_when: false
  failed_when: false

- name: Show pgbackrest check result
  ansible.builtin.debug:
    var: pgbackrest_check.stderr_lines
  when: pgbackrest_check.rc != 0

# --- Optional: OS-level systemd timer for full/diff backups ---
- name: Deploy pgbackrest backup systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/pgbackrest-backup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=pgBackRest backup ({{ pgbackrest_stanza }})
      After=network-online.target {{ pg_service_name }}.service

      [Service]
      Type=oneshot
      User=postgres
      ExecStart=/usr/bin/pgbackrest --stanza={{ pgbackrest_stanza }} --type=full backup
  when: pgbackrest_install_backup_timer | bool

- name: Deploy pgbackrest backup systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/pgbackrest-backup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Daily pgBackRest full backup ({{ pgbackrest_stanza }})

      [Timer]
      {{ pgbackrest_backup_schedule }}
      Persistent=true

      [Install]
      WantedBy=timers.target
  when: pgbackrest_install_backup_timer | bool

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: pgbackrest_install_backup_timer | bool

- name: Enable and start the pgbackrest backup timer
  ansible.builtin.systemd:
    name: pgbackrest-backup.timer
    state: started
    enabled: true
  when: pgbackrest_install_backup_timer | bool
