---
# Rocky 10 ships Cockpit (the web admin portal) socket-activated on :9090.
# Stopping alone isn't enough since the .socket unit will re-spawn it on
# the next connection attempt — mask both.

- name: Stop and disable cockpit.service
  ansible.builtin.systemd:
    name: cockpit.service
    state: stopped
    enabled: false
  ignore_errors: true   # fine if it's not installed at all

- name: Stop and mask cockpit.socket (prevents socket-activation restart)
  ansible.builtin.systemd:
    name: cockpit.socket
    state: stopped
    enabled: false
    masked: true
  ignore_errors: true

- name: Remove cockpit packages entirely
  ansible.builtin.dnf:
    name:
      - cockpit
      - cockpit-ws
      - cockpit-system
      - cockpit-bridge
    state: absent
  ignore_errors: true   # package set varies between minimal/server installs

- name: Confirm nothing is listening on 9090
  ansible.builtin.wait_for:
    port: 9090
    state: stopped
    timeout: 5
  ignore_errors: true
