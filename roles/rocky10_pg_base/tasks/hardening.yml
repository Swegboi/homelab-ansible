---
# --- Base packages ---
- name: Install baseline packages
  ansible.builtin.dnf:
    name:
      - firewalld
      - chrony
      - fail2ban
      - dnf-automatic
      - policycoreutils-python-utils   # semanage, for the SELinux bits later
      - vim-enhanced
      - tar
      - bzip2
    state: present

# --- SSH hardening (drop-in file, don't touch the shipped sshd_config) ---
- name: Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

# --- firewalld ---
- name: Ensure firewalld is running and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow SSH through firewalld
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled

- name: Allow a non-default SSH port through firewalld (only if ssh_port != 22)
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: ssh_port | int != 22

- name: Tell SELinux about a non-default SSH port (only if ssh_port != 22)
  community.general.seport:
    ports: "{{ ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when: ssh_port | int != 22

- name: Explicitly drop the Cockpit firewalld service if present
  ansible.posix.firewalld:
    service: cockpit
    permanent: true
    immediate: true
    state: disabled
  when: disable_cockpit | bool
  ignore_errors: true   # service definition may not exist on a minimal install

# --- fail2ban for sshd ---
- name: Enable fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = {{ ssh_port }}
      backend = systemd
      maxretry = 5
      bantime = 1h
      findtime = 10m
  when: enable_fail2ban | bool
  notify: restart sshd

- name: Ensure fail2ban is running and enabled
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  when: enable_fail2ban | bool

# --- chrony (time sync matters a lot for WAL/backup timestamps) ---
- name: Ensure chronyd is running and enabled
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

# --- unattended security patching ---
- name: Configure dnf-automatic for security updates only
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^upgrade_type\s*='
    line: "upgrade_type = security"
  when: enable_automatic_updates | bool

- name: Enable dnf-automatic timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: started
    enabled: true
  when: enable_automatic_updates | bool

# --- SELinux stays enforcing; we don't disable it ---
- name: Confirm SELinux is enforcing
  ansible.builtin.command: getenforce
  register: selinux_status
  changed_when: false

- name: Warn if SELinux is not enforcing
  ansible.builtin.debug:
    msg: >-
      WARNING: SELinux is '{{ selinux_status.stdout }}', not Enforcing.
      This role assumes Enforcing; PGDG packages ship correct file
      contexts for this out of the box, so leave it on unless you have
      a specific reason not to.
  when: selinux_status.stdout != "Enforcing"
